# 运行时编排：只拉取本地已有镜像，不含 build 段。
# 用于无法访问 GitHub、只能导入镜像的 NAS（如极空间）。
# 打包方法见 deploy/README.md 第二节；镜像由 deploy/package-offline.sh 生成。

services:
  wold:
    image: wol:1.1.0
    container_name: wold

    # 必须 host：WOL 是 UDP 广播，桥接网络下包只落在 docker0，设备不会开机，
    # 而接口仍返回 202、日志仍无错。详见 docs/E7-contract.md 第三节。
    network_mode: host

    restart: unless-stopped

    environment:
      # 口令必填：没设置时 compose 直接报错退出，避免起一个空口令服务。
      WOL_ADMIN_PASSWORD: ${WOL_ADMIN_PASSWORD:?请在 .env 中设置 WOL_ADMIN_PASSWORD}
      WOL_PORT: ${WOL_PORT:-8080}
      WOL_DATA_DIR: /data
      WOL_TOKEN_TTL: ${WOL_TOKEN_TTL:-168h}
      WOL_LOG_LEVEL: ${WOL_LOG_LEVEL:-info}

    # SQLite 落在命名卷上，不写容器层。
    # 挂宿主目录（-v /vol1/docker/wol:/data）也可以：属主由容器启动时自动修正。
    volumes:
      - wol-data:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:${WOL_PORT:-8080}/api/health\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  wol-data:
