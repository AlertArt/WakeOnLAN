<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>局域网唤醒</title>
<style>
  :root {
    --color-text: #1f2328;
    --color-muted: #6b7280;
    --color-border: #e5e7eb;
    --color-primary: #1565c0;
    --color-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.7; color: var(--color-muted); margin: 0 0 16px; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    font-size: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-muted); }
  .dot.ok { background: #2e7d32; }
  .dot.bad { background: #c62828; }
  footer { margin-top: 20px; font-size: 12px; color: var(--color-muted); }
</style>
</head>
<body>
<main>
  <h1>局域网唤醒系统</h1>
  <p>服务骨架已就绪。设备管理与唤醒界面将在后续环节接入，此处仅用于确认服务可达。</p>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="text">正在检测服务状态…</span>
  </div>
  <footer>E0 骨架占位页</footer>
</main>
<script>
  const dot = document.getElementById('dot');
  const text = document.getElementById('text');
  fetch('/api/health')
    .then((r) => r.json())
    .then((d) => {
      dot.classList.add(d.status === 'ok' ? 'ok' : 'bad');
      text.textContent = d.status === 'ok' ? '服务正常' : '服务异常：数据库不可用';
    })
    .catch(() => {
      dot.classList.add('bad');
      text.textContent = '无法连接服务';
    });
</script>
</body>
</html>
